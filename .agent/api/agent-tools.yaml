  workflows:
    - name: Coordinate independent provider actors and CMUX sessions
      steps:
        - Register the current native conversation automatically using agent-tools-actor-v2; no provider executor ancestry, executable install-path or launch-role check is required for ordinary task identity. No manual IDs, flags or user configuration.
        - Keep the existing persisted OS-random UUIDv4 actor-instance-id as machine namespace/salt. Derive base_id with RFC UUIDv5 using that namespace and UTF-8 compact JSON [agent-tools-actor-v2, base, os, canonical project path, Git identity, provider].
        - Project path is canonical Git top-level (canonical cwd outside Git); Windows replaces backslashes with slash, removes leading //?/ and ASCII-lowercases. Git identity is normalized origin URL without protocol/leading user, SSH shorthand colon becomes slash, trailing slash and final .git are removed; absent remote is empty string.
        - Derive origin.session_id with RFC UUIDv5 using base_id as namespace and compact JSON [agent-tools-actor-v2, normalized native conversation ID]. Native IDs are printable nonwhitespace ASCII up to256 bytes; UUIDs normalize to lowercase. Slots never enter the UUID hash, so temp deletion cannot let another conversation inherit gateway ownership. Same conversation survives executor restart/reconnect and slot renumbering.
        - Direct calls use own CODEX_THREAD_ID/SESSION_ID (both must agree) or CLAUDE_CODE_SESSION_ID; two-provider context is ambiguous and rejects. Hooks use installed provider plus own payload session_id and check same-provider native context. Never guess a peer from project/provider or terminal metadata. Plain-shell behavior without native metadata is unchanged.
        - Atomically allocate/reuse a positive local session_slot under native OS temp agent-tools-actors/instance_id/base_id using conversation UUID as key. Slots1-65535 are readable metadata; expose actor_id as base_id-session_slot. No service, daemon or assignment policy; corrupt local records do not select a peer.
        - All task mutations retain four gateway origin headers independently of CMUX absence/old API/unbound membership. Version2 CMUX announce/resolve sends origin, provider_session_id, base_id, session_slot, actor_id and optional repository; it has no executor_generation requirement. Validate exact origin/native/base/slot/actor_id echo and bound recipient context. CMUX alone correlates unique native terminal membership and keeps process/TUI generation fences for delivery.
        - SessionStart/UserPromptSubmit and ordinary calls reuse and announce the registration. Notification-first hooks privately announce then return without context output. Existing whole-prompt version1 enrollment-token envelope is separate from actor registration; ordinary registration/mutations need no token. Endpoint discovery and bounded native transport are unchanged.
        - SDKv1.21.0 is released with matching validated/distributable CMUXv0.6.8 integration. For paired coordination, update/restart CMUX first, then update the SDK and restart the provider. CMUX retains old client v1 support during rollout. New actor UUIDs require legitimate release/closure of old-origin claims before switching the installed client; never fall back to an old owner. Native Actions fixtures and live Windows acceptance remain distinct.
    - name: Author and retrieve unified OKF knowledge
      steps:
        - Put repository-authored OKF 0.2 Markdown under .agents/knowledge or pass an explicit in-repository bundle path.
        - Validate with agent-tools okf validate PATH; missing required structures return status 2, while broken links remain warnings.
        - Run agent-tools index for the conventional bundle or agent-tools okf import PATH for an explicit bundle.
        - Search with agent-tools search QUERY --type knowledge and optional namespace, kind, status, origin, path, language, and relation filters.
        - Use agent-tools get RESOURCE, graph, refs, imports, or impls for canonical metadata and bounded typed relationships.
        - Treat repository and gateway records as authoritative at their source; project.db is a rebuildable projection.
    - name: Project OKF into markdown context
      steps:
        - Preview without gateway access or side effects using agent-tools okf publish PATH --dry-run.
        - Publish one-way using agent-tools okf publish PATH; canonical OKF identity is source_ref and content hash is version.
        - Reuse identical source_ref and version pairs; changed hashes are updates.
        - Preserve raw frontmatter, normalized metadata, body, links, authority, and inert Attested Computation metadata.
        - Do not synchronize gateway edits back into repository files and never execute OKF computations.
    - name: Discover markdown context placement
      steps:
        - Run agent-tools docs hierarchy --scope all before publishing or reorganizing docs.
        - Use --app APP or --space SPACE when the destination app or wiki space is known.
        - Use breadcrumbs, page/section ids, and placement hints from the hierarchy response to choose where new docs belong.
        - Render scope, global_rank, owner_project, wiki_path, artifact_id, and artifact_version_id when the gateway returns them.
        - Keep source/provenance ids for debugging, but use markdown context terminology in agent-facing output.
    - name: Search shared markdown context
      steps:
        - Run agent-tools docs search "<query>" --scope global to find globally visible shared docs.
        - Treat global_rank as gateway-provided priority metadata configured in the gateway UI as Global 1, Global 2, and so on.
        - Do not infer priority from SRE, security, platform, or owner_project naming conventions.
        - Expect results to render scope, global_rank, owner_project, wiki_path, artifact_id, and artifact_version_id when present.
    - name: Fetch local plus global chunks
      steps:
        - Run agent-tools docs chunks --query "<query>" --scope all for RAG context that combines project-local and global docs.
        - Preserve gateway result ordering; the CLI should not hardcode owner/project precedence for global docs.
        - Inspect scope, global_rank, owner_project, wiki_path, and provenance ids on each chunk before deciding what context applies.
    - name: Publish markdown context
      steps:
        - Author a docs-first file such as .agent/api/<app>.yaml with app, title, content, and optional space/category/parent_page/parent_id/slug/order/sort_order placement metadata.
        - Use global_rank and global_descendants only when the user intends the page or subtree to be globally visible.
        - Validate locally with agent-tools docs validate --file PATH.
        - Publish with agent-tools docs publish --file PATH.
        - Search with agent-tools docs search and retrieve RAG chunks with agent-tools docs chunks; results may include breadcrumbs, page/section targets, scope, global_rank, owner_project, and wiki_path.
    - name: Sync app-scoped hooks
      steps:
        - Run agent-tools setup hooks after gateway setup to pull hooks for detected clients.
        - Use agent-tools setup hooks --app codex, --app claude, or --app gemini for one namespace.
        - Treat hooks as app-scoped; never install hook records returned for a different app namespace.
        - Hook names must be safe relative paths under the client hook directory; setup verifies size/checksum metadata when present.
    - name: Publish global patterns
      steps:
        - Validate a pattern file or markdown catalog with agent-tools patterns validate --file PATH.
        - Preview extracted payloads with agent-tools patterns preview --file PATH.
        - Publish or update by slug with agent-tools patterns publish --file PATH.
        - Use --category to classify patterns, for example programming-language/golang.
    - name: Search pattern guidance
      steps:
        - Run agent-tools patterns search QUERY --version latest --state active.
        - Add --category or --label when the desired guidance family is known.
        - Fetch full bodies with agent-tools patterns get ID_OR_SLUG before editing or applying a pattern.
  endpoints:
    - method: GET
      path: /v1/projects/:ident/api-docs/hierarchy
      purpose: Return a wiki-style markdown context tree with spaces, pages, sections, breadcrumbs, placement hints, version ids, labels, and provenance pointers.
      query:
        - q
        - app
        - space
        - scope
      response_fields:
        - scope
        - global_rank
        - owner_project
        - wiki_path
        - artifact_id
        - artifact_version_id
    - method: GET
      path: /v1/projects/:ident/api-docs/chunks
      purpose: Return ranked markdown context chunks with breadcrumbs and page/section targets when available.
      query:
        - q
        - app
        - label
        - kind
        - scope
      response_fields:
        - scope
        - global_rank
        - owner_project
        - wiki_path
        - artifact_id
        - artifact_version_id
    - method: GET
      path: /v1/projects/:ident/api-docs
      purpose: List or search markdown context entries with optional local/global/all visibility scope.
      query:
        - q
        - app
        - label
        - kind
        - scope
      response_fields:
        - scope
        - global_rank
        - owner_project
        - wiki_path
        - artifact_id
        - artifact_version_id
    - method: POST
      path: /v1/projects/:ident/api-docs
      purpose: Publish a docs-first markdown context entry with optional wiki placement metadata.
      request:
        required:
          - app
          - title
          - content
        optional:
          - space
          - category
          - parent_page
          - parent_id
          - slug
          - order
          - sort_order
          - global_rank
          - global_descendants
          - summary
          - labels
          - source_ref
          - version
    - method: GET
      path: /v1/hooks
      purpose: List app-scoped hook records for setup sync.
      query:
        - app
      response_fields:
        - app
        - name
        - content
        - size
        - checksum
        - updated_at
    - method: GET
      path: /v1/patterns
      purpose: List or search global patterns.
      query:
        - q
        - label
        - category
        - version
        - state
        - superseded_by
    - method: GET
      path: /v1/patterns/:id
      purpose: Fetch one pattern by id or slug.
    - method: POST
      path: /v1/patterns
      purpose: Create a global pattern.
    - method: PATCH
      path: /v1/patterns/:id
      purpose: Update pattern metadata or body.
    - method: DELETE
      path: /v1/patterns/:id
      purpose: Delete a pattern.
    - method: GET
      path: /v1/patterns/:id/comments
      purpose: List comments for a pattern.
    - method: POST
      path: /v1/patterns/:id/comments
      purpose: Add an agent comment to a pattern.
  auth:
    scheme: gateway_api_key
    header: Authorization
    agent_id_header: X-Agent-ID
  safety:
    - Keep CLI output concise and agent-facing; do not add JSON output flags for agent workflows.
    - Use markdown context as the primary agent-facing term. Reserve artifact ids for provenance/debug output and low-level artifact commands.
    - Treat scope, global_rank, owner_project, wiki_path, artifact_id, and artifact_version_id as gateway-provided metadata; preserve gateway ordering for global docs.
    - Always request hooks with an explicit app namespace such as codex, claude, or gemini; hooks are not portable across clients.
    - Reject unsafe hook names before writing; names must be relative paths without parent-directory traversal.
    - Fetch pattern body and comments before editing an existing gateway pattern.
    - Treat categories as routing metadata and labels as looser search tags.
    - Preserve slug stability for published pattern catalogs so repeat publishes update existing records.
  schemas:
    unified_knowledge_resource:
      fields:
        - canonical_uri
        - namespace
        - kind
        - title
        - description
        - origin_kind
        - origin_id
        - authority
        - status
        - stale_after
        - current_version_id
        - revision
        - content_hash
        - tags
        - provenance_count
        - verification_count
    unified_knowledge_edge:
      fields:
        - source_uri
        - target_uri
        - unresolved_ref
        - relation
        - confidence
        - extractor
        - source_path
        - start_line
    pattern:
      fields:
        - id
        - title
        - slug
        - summary
        - body
        - labels
        - categories
        - version
        - state
        - author
        - created_at
        - updated_at
    documentation_hierarchy_node:
      fields:
        - id
        - kind
        - title
        - slug
        - path
        - app
        - space
        - category
        - parent_page
        - parent_id
        - order
        - sort_order
        - scope
        - global_rank
        - global_descendants
        - owner_project
        - wiki_path
        - labels
        - current_version_id
        - accepted_version_id
        - breadcrumbs
        - sections
        - children
        - source_ref
        - source_artifact_id
        - source_artifact_version_id
        - artifact_id
        - artifact_version_id
    hook_record:
      fields:
        - app
        - name
        - content
        - size
        - checksum
        - updated_at
    create_pattern_request:
      required:
        - title
        - body
        - version
        - state
        - author
      optional:
        - slug
        - summary
        - labels
        - categories
  examples:
    - name: Publish DevelopWithGo catalog
      command: agent-tools patterns publish --file DevelopWithGo.md
    - name: Search Go patterns by category
      command: agent-tools patterns search router --category programming-language/golang --version latest --state active
    - name: Browse local plus global markdown context hierarchy
      command: agent-tools docs hierarchy --scope all
    - name: Search globally visible markdown context
      command: agent-tools docs search "publishing api context" --scope global
    - name: Fetch local plus global markdown context chunks
      command: agent-tools docs chunks --query "artifact provenance" --scope all
