app: agent-tools
title: Agent Tools gateway API context
summary: Agent-first context for gateway-backed agent-tools workflows, including markdown context, app-scoped hooks, and global patterns.
kind: agent_context
source_format: agent_context
source_ref: .agent/api/agent-tools.yaml
labels:
  - agent-tools
  - gateway
  - documentation
  - hooks
  - patterns
content:
  purpose: >
    Agent Tools exposes gateway-backed command surfaces for project
    markdown context, app-scoped hook setup, global implementation
    patterns, task tracking, and comms. Agents should use this context before
    changing the matching CLI or gateway client contracts.
