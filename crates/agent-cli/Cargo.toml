[package]
name = "agent-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-tools"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
agent-fs = { path = "../agent-fs" }
agent-symbols = { path = "../agent-symbols" }
agent-search = { path = "../agent-search" }
agent-knowledge = { path = "../agent-knowledge" }
agent-comms = { path = "../agent-comms" }
agent-updater = { path = "../agent-updater" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
time = { workspace = true }
gethostname = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
toml_edit = "0.22"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
