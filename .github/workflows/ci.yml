name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"

jobs:
  linux-release-compatibility:
    name: Linux release compatibility (glibc 2.31)
    runs-on: ubuntu-latest
    container: rust:1-bullseye@sha256:02d78ca3f928195c2a907543de778adfd728ad7e2a24fdc6aef582b7c77842e0
    steps:
      - uses: actions/checkout@v6
      - name: Install ABI inspection tools
        run: apt-get update && apt-get install -y --no-install-recommends binutils ca-certificates
      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: linux-release-bullseye-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-release-bullseye-
      - run: cargo build --workspace --release --target x86_64-unknown-linux-gnu
      - name: Enforce glibc baseline
        run: |
          GLIBC_BASELINE=2.31 scripts/check-glibc-baseline.sh \
            target/x86_64-unknown-linux-gnu/release/agent-tools \
            target/x86_64-unknown-linux-gnu/release/agent-tools-mcp \
            target/x86_64-unknown-linux-gnu/release/agent-sync

  knowledge-graph:
    name: knowledge-graph-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: macos
            os: macos-latest
          - label: windows
            os: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: knowledge-graph-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: knowledge-graph-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-
      - run: cargo build --workspace --release
